name: Validate knowledge graph port

on:
  push:
    branches:
      - agent/port-knowledge-graph
    paths:
      - plugins/memory/knowledge_graph/**
      - tests/plugins/memory/test_knowledge_graph_provider.py
      - .github/workflows/validate-knowledge-graph-port.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-knowledge-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install locked dependencies
        run: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Compile provider
        run: uv run python -m py_compile plugins/memory/knowledge_graph/__init__.py

      - name: Lint provider and tests
        run: uv run ruff check plugins/memory/knowledge_graph/__init__.py tests/plugins/memory/test_knowledge_graph_provider.py

      - name: Run focused tests
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: uv run python -m pytest tests/plugins/memory/test_knowledge_graph_provider.py -q
